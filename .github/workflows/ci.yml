name: C++ Makefile CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++

      # ==========================================================================================
      # Makefile build and tests
      # ==========================================================================================

      # Remove committed binaries and objects before compiling on Linux.
      - name: Clean previous build
        run: make clean

      # Use the compiler, flags, sources, and build directory in Makefile.
      - name: Build application
        run: make all

      - name: Run C++ tests
        run: make test-all

      # ==========================================================================================
      # CMake build and tests
      # ==========================================================================================

      - name: Configure CMake
        run: cmake -S . -B build-cmake

      - name: Build application and tests with CMake
        run: cmake --build build-cmake --parallel

      - name: Run C++ tests with CTest
        run: ctest --test-dir build-cmake --output-on-failure