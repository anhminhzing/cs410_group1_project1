name: C++ Makefile CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++

      # Remove committed binaries and objects before compiling on Linux.
      - name: Clean previous build
        run: make clean

      # Use the compiler, flags, sources, and build directory in Makefile.
      - name: Build application
        run: make all

      # test_room reads a positive capacity from standard input.
      - name: Run C++ tests
        run: printf '5\n' | make test-all
