name: C++ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # clean before building 
      - name: Clean
        run: make BUILD_DIR=ci-build clean

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++

      # Avoid reusing binaries or object files committed in build/.
      - name: Build
        run: make BUILD_DIR=ci-build all

      # test_room reads a positive capacity from standard input.
      - name: Test
        run: printf '5\n' | make BUILD_DIR=ci-build test-all
